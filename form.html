<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Submit a detailed product review and overall star rating for your recently installed equipment to help us improve user experience.">
    <meta name="author" content="Arowolaje Joshua Oluwatimileyin">
    <title>Product Review Form</title>
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>

    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form action="review.html" method="get">
            <div class="form-item">
                <label for="product-select">Product Name <span class="required">*</span></label>
                <select id="product-select" name="productName" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>
            </div>
            <fieldset class="form-item">
                <legend>Overall Rating <span class="required">*</span></legend>
                <div class="star-rating">
                    <input type="radio" id="star5" name="rating" value="5" required>
                    <label for="star5" title="5 stars">★</label>

                    <input type="radio" id="star4" name="rating" value="4" required>
                    <label for="star4" title="4 stars">★</label>

                    <input type="radio" id="star3" name="rating" value="3" required>
                    <label for="star3" title="3 stars">★</label>

                    <input type="radio" id="star2" name="rating" value="2" required>
                    <label for="star2" title="2 stars">★</label>

                    <input type="radio" id="star1" name="rating" value="1" required>
                    <label for="star1" title="1 star">★</label>
                </div>
            </fieldset>

            <div class="form-item">
                <label for="install-date">Date of Installation <span class="required">*</span></label>
                <input type="date" id="install-date" name="installDate" required>
            </div>

            <fieldset class="form-item">
                <legend>Which features did you find useful? (Check all that apply)</legend>
                <div class="checkbox-group">
                    <label for="feature-durability">
                        <input type="checkbox" id="feature-durability" name="features" value="durability">
                        Durability
                    </label>
                    <label for="feature-ease">
                        <input type="checkbox" id="feature-ease" name="features" value="ease-of-use">
                        Ease of Use
                    </label>
                    <label for="feature-performance">
                        <input type="checkbox" id="feature-performance" name="features" value="performance">
                        Performance
                    </label>
                    <label for="feature-design">
                        <input type="checkbox" id="feature-design" name="features" value="design">
                        Design / Aesthetics
                    </label>
                </div>
            </fieldset>

            <div class="form-item">
                <label for="written-review">Written Review (Optional)</label>
                <textarea id="written-review" name="writtenReview" rows="5" placeholder="Share details of your experience..."></textarea>
            </div>

            <div class="form-item">
                <label for="user-name">Your Name (Optional)</label>
                <input type="text" id="user-name" name="userName" placeholder="e.g., Jane Doe">
            </div>

            <div class="form-item">
                <input type="submit" value="Post Review" class="submit-btn">
            </div>

        </form>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> Arowolaje Joshua Oluwatimileyin.</p>
        <p id="lastModified"></p>
    </footer>

</body>
</html>
